# DataSource Configuration
# Values come from the environment so nothing secret lives in the repo.
# Defaults point at the local docker-compose MySQL (see docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/healthnetstorage?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:healthnet}
spring.datasource.password=${DB_PASSWORD:healthnet_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration (HikariCP is the default pool in Spring Boot)
# Free database tiers cap total connections (often 20 or fewer), and minimum-idle
# holds them open even when the app is idle. Keep these small in production.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Optional: Enable SQL statement logging (Useful for debugging)
spring.datasource.hikari.pool-name=HikariPool
logging.level.org.springframework.jdbc.core=DEBUG

# Spring Transaction Management
spring.transaction.default-timeout=240s
spring.transaction.rollback-on-commit-failure=true

# Server Configuration
server.port=${PORT:8081}

# JWT signing secret. Must be set in production.
jwt.secret=${JWT_SECRET:}

# ---------------------------------------------------------------------------
# AI query service
# The original service (http://159.89.49.64:7898) no longer exists.
# When healthnet.ai.enabled=false the chat endpoints return a clear
# "unavailable" message immediately instead of hanging for 10 minutes.
# Set the URL and flip enabled=true to plug a replacement service back in.
# ---------------------------------------------------------------------------
healthnet.ai.enabled=${AI_ENABLED:false}
healthnet.ai.base-url=${AI_BASE_URL:http://localhost:7898}
healthnet.ai.url=${AI_URL:${healthnet.ai.base-url}/api/query}
healthnet.ai.timeout-ms=${AI_TIMEOUT_MS:60000}
healthnet.ai.unavailable-message=The AI assistant is currently unavailable. This deployment does not have an AI service configured.
